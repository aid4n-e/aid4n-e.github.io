---
layout: default
---
<article class="project">
  <p class="back"><a href="{{ '/#projects' | relative_url }}">&larr; All projects</a></p>
  <h1>{{ page.title }}</h1>
  <p class="lede">{{ page.summary }}</p>
  <p class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</p>
  {% if page.repo %}<p><a class="button" href="{{ page.repo }}">View code on GitHub</a></p>{% endif %}
  {{ content }}
</article>
