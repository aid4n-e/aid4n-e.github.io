<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://github.com/{{ site.github }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>{{ site.title }}</span>
      <span>
        <a href="mailto:{{ site.email }}">Email</a> ·
        <a href="https://github.com/{{ site.github }}">GitHub</a> ·
        <a href="https://linkedin.com/in/{{ site.linkedin }}">LinkedIn</a>
      </span>
    </div>
  </footer>
</body>
</html>
